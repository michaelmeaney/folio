name: Plugin validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Folio plugin resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate plugin package and resources
        run: python3 scripts/validate_plugin.py .

      - name: Validate semantic contracts and preservation regressions
        run: |
          python3 -m pip install -r requirements-schema.txt
          python3 -m unittest discover -s tests -v
